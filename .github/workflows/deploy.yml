name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  # Refresh star counts and release tags once a day, at 04:00 CST.
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

# The sync job commits the refreshed registry back; everything else only reads.
permissions:
  contents: write

# Two deploys at once would race inside the same web root. One at a time,
# newest wins.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only on a scheduled or manual run — a push deploy uses the registry as
      # committed, so the numbers on the site never jump around between runs.
      - name: Refresh the GitHub registry
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm sync:github

      - name: Commit the registry if it changed
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/generated/registry.json
          git diff --cached --quiet || {
            git commit -m "chore: refresh GitHub registry"
            git push
          }

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Either credential works, key first where both are set. Resolved here
      # rather than in each step's `if` because the secrets context is not
      # available in a step condition — and because a missing credential
      # otherwise surfaces as an SSH timeout several minutes in, which reads
      # like a server problem and is not one.
      - name: Resolve the auth method
        id: auth
        if: github.event_name != 'pull_request'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "method=key" >> "$GITHUB_OUTPUT"
            echo "Authenticating with a private key."
          elif [ -n "$SSH_PASSWORD" ]; then
            echo "method=password" >> "$GITHUB_OUTPUT"
            echo "Authenticating with a password."
          else
            echo "::error::Set either the SSH_PASSWORD or the SSH_PRIVATE_KEY repository secret."
            exit 1
          fi

      - name: Load SSH key
        if: steps.auth.outputs.method == 'key'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install sshpass
        if: steps.auth.outputs.method == 'password'
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Add server to known_hosts
        if: github.event_name != 'pull_request'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy with rsync
        if: github.event_name != 'pull_request'
        # -rltz: recurse, keep symlinks + mod-times, compress — but NOT -a's
        # owner/group/perms preservation, which fails (exit 23) on files the
        # deploy user does not own. --mkpath creates DEPLOY_PATH if missing;
        # --chmod gives uploaded files sane web perms regardless of umask.
        # The excludes protect what the panel and certbot own in the web root.
        # rsync will not delete an excluded path, which is the point: nothing
        # here is produced by the build, so --delete would otherwise take them.
        #   .well-known  certbot's ACME challenge dir — deleting it mid-renewal
        #                breaks certificate issuance
        #   .user.ini    BaoTa's per-directory PHP config, carrying chattr +i,
        #                so the unlink fails and rsync exits 23 even though
        #                every file transferred
        #   .htaccess    the panel's per-directory Apache config
        # This is the same preserve list upload.js uses on the docs sites.
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          # sshpass -e takes the password from the environment. Passing it as
          # -p would put it in the process list, where anything else running on
          # the runner could read it.
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          RSH="ssh -p ${SSH_PORT:-22}"
          if [ "${{ steps.auth.outputs.method }}" = "password" ]; then
            RSH="sshpass -e ssh -p ${SSH_PORT:-22}"
          fi

          rsync -rltvz --delete --mkpath \
            --no-perms --no-owner --no-group --omit-dir-times \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            --exclude='/.well-known/' \
            --exclude='/.user.ini' \
            --exclude='/.htaccess' \
            -e "$RSH" \
            dist/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}"
